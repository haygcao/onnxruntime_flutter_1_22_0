# Run with `dart run ffigen --config ffigen_onnxruntime.yaml`.
name: OnnxRuntimeBindings
description: |
  Bindings for `src/onnxruntime/onnxruntime_c_api.h`.

  Regenerate bindings with `dart run ffigen --config ffigen_onnxruntime.yaml`.
output: 'lib/src/bindings/onnxruntime_bindings_generated.dart'
headers:
  entry-points:
    - 'src/onnxruntime/coreml_provider_factory.h'
    - 'src/onnxruntime/cpu_provider_factory.h'
    - 'src/onnxruntime/nnapi_provider_factory.h'
    - 'src/onnxruntime/onnxruntime_c_api.h'
  include-directives:
    - 'src/onnxruntime/coreml_provider_factory.h'
    - 'src/onnxruntime/cpu_provider_factory.h'
    - 'src/onnxruntime/nnapi_provider_factory.h'
    - 'src/onnxruntime/onnxruntime_c_api.h'
compiler-opts:
  - '-U_WIN32'
  - '-U_WIN64'
  - '-U_MSC_VER'
  - '-D__linux__'
enums:
  as-int:
    include:
      - '.*'
preamble: |
  // ignore_for_file: always_specify_types
  // ignore_for_file: camel_case_types
  // ignore_for_file: non_constant_identifier_names
  // ignore_for_file: subtype_of_base_or_final_is_not_base_final_or_sealed
comments:
  style: any
  length: full
