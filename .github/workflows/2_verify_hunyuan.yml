name: 2. Verify Tencent Hunyuan-MT 1.8B

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  test-hunyuan:
    name: Verify Tencent Hunyuan-MT 1.8B (Isolated)
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: auto-sync

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
          cache: true

      - name: Download Tencent Hunyuan-MT Model (onnx-community/HY-MT1.5-1.8B-ONNX)
        shell: bash
        run: |
          mkdir -p test_hunyuan_dir
          echo "📥 Downloading Tencent Hunyuan-MT 1.8B from onnx-community/HY-MT1.5-1.8B-ONNX..."
          curl -L -C - --retry 5 -o test_hunyuan_dir/model_q4f16.onnx \
            "https://huggingface.co/onnx-community/HY-MT1.5-1.8B-ONNX/resolve/main/onnx/model_q4f16.onnx"

      - name: Run Hunyuan Inference Test
        env:
          LLM_MODEL_DIR: ./test_hunyuan_dir
        run: |
          flutter pub get
          flutter test test/llm_release_gate_test.dart

      # ── 混元跑完后，主动触发下一个独立的工作流：千问模型专项测试 ──
      - name: Trigger Next Workflow (Verify Qwen)
        shell: bash
        run: |
          echo "🚀 Triggering next workflow: 3_verify_qwen.yml..."
          gh workflow run "3. Verify Alibaba Qwen 3.5 0.8B" --ref auto-sync || echo "Dispatched via API"
