name: 3. Verify Alibaba Qwen 3.5 0.8B

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-qwen:
    name: Verify Alibaba Qwen 3.5 0.8B (Isolated)
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: auto-sync

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
          cache: true

      - name: Download Alibaba Qwen 3.5 Model and External Data
        shell: bash
        run: |
          mkdir -p test_qwen_dir
          echo "📥 Downloading Alibaba Qwen 3.5 Graph (0.8MB)..."
          curl -L -C - --retry 5 -o test_qwen_dir/decoder_model_merged_q4.onnx \
            "https://huggingface.co/onnx-community/Qwen3.5-0.8B-ONNX/resolve/main/onnx/decoder_model_merged_q4.onnx"

          echo "📥 Downloading Alibaba Qwen 3.5 Weights Data (485MB)..."
          curl -L -C - --retry 5 -o test_qwen_dir/decoder_model_merged_q4.onnx_data \
            "https://huggingface.co/onnx-community/Qwen3.5-0.8B-ONNX/resolve/main/onnx/decoder_model_merged_q4.onnx_data"

      - name: Run Qwen Inference Test
        env:
          LLM_MODEL_DIR: ./test_qwen_dir
        run: |
          flutter pub get
          flutter test test/llm_release_gate_test.dart
