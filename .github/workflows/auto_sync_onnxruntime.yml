name: Auto-Sync ONNX Runtime & Full Model Verification Release

on:
  schedule:
    # 每周一 02:00 UTC 自动巡检官方最新版本
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      target_version:
        description: 'Target ONNX Runtime Version (e.g. 1.24.0 or leave empty for latest)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-and-inspect:
    name: Sync Binaries, Inspect APIs & Download Full Model Matrix
    runs-on: ubuntu-latest
    outputs:
      ort_version: ${{ steps.run_sync.outputs.ort_version }}
      has_changes: ${{ steps.check_git.outputs.has_changes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: auto-sync

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Multi-Platform Sync & Full Model Download
        id: run_sync
        run: |
          python scripts/sync_onnxruntime.py "${{ github.event.inputs.target_version }}"
          VERSION=$(grep -m 1 "Release Tag" SYNC_SUMMARY.md | awk -F'`' '{print $2}' | sed 's/^v//')
          echo "ort_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if files were modified
        id: check_git
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Synced Artifacts (Including Models)
        if: steps.check_git.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: synced-repo-with-models
          path: ./

  matrix-verification:
    name: Full Model Inference Test on ${{ matrix.os }}
    needs: sync-and-inspect
    if: needs.sync-and-inspect.outputs.has_changes == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Download Synced Repo With Models
        uses: actions/download-artifact@v4
        with:
          name: synced-repo-with-models

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.x'
          channel: 'stable'
          cache: true

      - name: Regenerate Dart FFI Bindings
        run: |
          flutter pub get
          dart run ffigen --config ffigen_onnxruntime.yaml

      - name: Run Full Model Verification (Hunyuan + Qwen + PP-OCR + MangaLens)
        env:
          TEST_MODEL_DIR: ./test_models
        run: |
          flutter test test/real_models_verification_test.dart

  auto-publish-release:
    name: Publish Verified Release
    needs: [sync-and-inspect, matrix-verification]
    runs-on: ubuntu-latest
    steps:
      - name: Download Synced Repo
        uses: actions/download-artifact@v4
        with:
          name: synced-repo-with-models

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.sync-and-inspect.outputs.ort_version }}"
          name: "🚀 ONNX Runtime v${{ needs.sync-and-inspect.outputs.ort_version }} (Full LLM Matrix Verified)"
          body_path: SYNC_SUMMARY.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
