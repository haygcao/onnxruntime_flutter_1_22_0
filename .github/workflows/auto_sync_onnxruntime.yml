name: Auto-Sync ONNX Runtime & Real Model Verification

on:
  schedule:
    # 每周一 02:00 UTC 自动巡检官方最新版本
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      target_version:
        description: 'Target ONNX Runtime Version (e.g. 1.24.0 or leave empty for latest)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-verify:
    name: Check Latest ORT & Run Verification
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: auto-sync

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.x'
          channel: 'stable'
          cache: true

      - name: Fetch Latest ONNX Runtime Release Info
        id: get_release
        shell: pwsh
        run: |
          $inputVer = "${{ github.event.inputs.target_version }}".Trim()
          if ($inputVer -ne "") {
            $tag = if ($inputVer.StartsWith("v")) { $inputVer } else { "v$inputVer" }
            $apiUrl = "https://api.github.com/repos/microsoft/onnxruntime/releases/tags/$tag"
          } else {
            $apiUrl = "https://api.github.com/repos/microsoft/onnxruntime/releases/latest"
          }
          
          Write-Host "Querying: $apiUrl"
          $response = Invoke-RestMethod -Uri $apiUrl -Headers @{ "User-Agent" = "GitHub-Action" }
          $versionTag = $response.tag_name
          $cleanVersion = $versionTag.TrimStart('v')
          
          Write-Host "Latest ONNX Runtime version found: $cleanVersion ($versionTag)"
          echo "version=$cleanVersion" >> $env:GITHUB_OUTPUT
          echo "tag=$versionTag" >> $env:GITHUB_OUTPUT

      - name: Download & Update Windows DLL and C Headers
        shell: pwsh
        run: |
          $version = "${{ steps.get_release.outputs.version }}"
          $zipUrl = "https://github.com/microsoft/onnxruntime/releases/download/v$version/onnxruntime-win-x64-$version.zip"
          Write-Host "Downloading: $zipUrl"
          
          $outputZip = "$env:TEMP/ort_win_x64.zip"
          $extractDir = "$env:TEMP/ort_win_x64_extracted"
          
          Invoke-WebRequest -Uri $zipUrl -OutFile $outputZip
          Expand-Archive -Path $outputZip -DestinationPath $extractDir -Force
          
          $extractedRoot = Get-ChildItem -Path $extractDir -Directory | Select-Object -First 1
          
          # 1. 更新 windows/onnxruntime.dll
          Copy-Item "$($extractedRoot.FullName)/lib/onnxruntime.dll" "windows/onnxruntime.dll" -Force
          Write-Host "Successfully updated windows/onnxruntime.dll"
          
          # 2. 更新 C API 头文件 (用于 ffigen)
          if (Test-Path "$($extractedRoot.FullName)/include/onnxruntime_c_api.h") {
            Copy-Item "$($extractedRoot.FullName)/include/onnxruntime_c_api.h" "src/onnxruntime/onnxruntime_c_api.h" -Force
            Write-Host "Successfully updated src/onnxruntime/onnxruntime_c_api.h"
          }

      - name: Regenerate Dart FFI Bindings
        run: |
          flutter pub get
          dart run ffigen --config ffigen_onnxruntime.yaml

      - name: Download AI Models for Real-world Verification
        shell: pwsh
        run: |
          $modelDir = "$env:TEMP/onnx_models"
          New-Item -ItemType Directory -Force -Path $modelDir | Out-Null
          
          # 官方真实模型列表 (包含目标检测、OCR、高版本 IR 10 模型)
          $models = @(
            @{ Name = "ppocrv5_det.onnx"; Url = "https://huggingface.co/HoVDuc/ppocrv5-onnx/resolve/main/ppocrv5_det_p9.onnx" },
            @{ Name = "ppocrv5_rec.onnx"; Url = "https://huggingface.co/HoVDuc/ppocrv5-onnx/resolve/main/ppocrv5_rec_p9.onnx" },
            @{ Name = "mangalens.onnx"; Url = "https://huggingface.co/khanhromvn/manga_bubble_seg/resolve/main/mangalens.onnx" }
          )
          
          foreach ($m in $models) {
            $dest = Join-Path $modelDir $m.Name
            Write-Host "Downloading test model: $($m.Name)..."
            Invoke-WebRequest -Uri $m.Url -OutFile $dest
          }
          
          echo "TEST_MODEL_DIR=$modelDir" >> $env:GITHUB_ENV

      - name: Run Flutter Tests & Real Model Inference
        run: |
          flutter test

      - name: Check for Changes & Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(ort): auto-upgrade ONNX Runtime to ${{ steps.get_release.outputs.version }}"
          title: "🤖 [Auto-Sync] Upgrade ONNX Runtime to ${{ steps.get_release.outputs.version }}"
          body: |
            ## 🚀 Automated ONNX Runtime Upgrade
            - **New Version**: `${{ steps.get_release.outputs.version }}`
            - **Artifact Source**: [Microsoft ONNX Runtime Release v${{ steps.get_release.outputs.version }}](https://github.com/microsoft/onnxruntime/releases/tag/v${{ steps.get_release.outputs.version }})
            - **FFI Bindings**: Automatically regenerated with `ffigen`.
            - **Test Suite**: ✅ All real-world models (PP-OCRv5, MangaLens) passed full inference verification on Windows!
          branch: "sync-ort-${{ steps.get_release.outputs.version }}"
          base: "auto-sync"
