name: Auto-Sync ONNX Runtime & Verified Release

on:
  schedule:
    # 每周一 02:00 UTC 自动巡检官方最新版本
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      target_version:
        description: 'Target ONNX Runtime Version (e.g. 1.24.0 or leave empty for latest)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

# 禁止并发，全局单任务串行执行，避免资源耗尽与超时
concurrency:
  group: onnxruntime-sync-pipeline
  cancel-in-progress: false

jobs:
  sync-verify-and-release:
    name: Single Sequential Pipeline (Sync -> Test -> Release)
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: auto-sync

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
          cache: true

      - name: Run Multi-Platform Sync & Sequential Model Download
        id: run_sync
        shell: bash
        run: |
          python scripts/sync_onnxruntime.py "${{ github.event.inputs.target_version }}"
          VERSION=$(grep -m 1 "Release Tag" SYNC_SUMMARY.md | awk -F'`' '{print $2}' | sed 's/^v//')
          echo "ort_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check for Changes
        id: check_git
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Regenerate Dart FFI Bindings
        if: steps.check_git.outputs.has_changes == 'true'
        run: |
          flutter pub get
          dart run ffigen --config ffigen_onnxruntime.yaml

      - name: Run Real Model Inference Test (Sequentially One-by-One)
        if: steps.check_git.outputs.has_changes == 'true'
        env:
          TEST_MODEL_DIR: ./test_models
        run: |
          flutter test test/real_models_verification_test.dart

      - name: Publish Verified GitHub Release
        if: steps.check_git.outputs.has_changes == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.run_sync.outputs.ort_version }}"
          name: "🚀 ONNX Runtime v${{ steps.run_sync.outputs.ort_version }} (Verified Release)"
          body_path: SYNC_SUMMARY.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
