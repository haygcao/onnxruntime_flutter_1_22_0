name: 3. Verify Tencent Hunyuan-MT 1.8B

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

# 严格单例并发控制：绝不同时运行多个实例，防止云端资源超标
concurrency:
  group: hunyuan-verification
  cancel-in-progress: false

jobs:
  test-hunyuan:
    name: Verify Tencent Hunyuan-MT 1.8B (Isolated)
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: auto-sync

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
          cache: true

      - name: Download Tencent Hunyuan-MT Model and External Data
        shell: bash
        run: |
          mkdir -p test_hunyuan_dir
          echo "📥 Downloading Tencent Hunyuan-MT 1.8B Graph (0.4MB)..."
          curl -L -C - --retry 5 -o test_hunyuan_dir/model_q4f16.onnx \
            "https://huggingface.co/onnx-community/HY-MT1.5-1.8B-ONNX/resolve/main/onnx/model_q4f16.onnx"
          
          echo "📥 Downloading Tencent Hunyuan-MT 1.8B Weights Data (1.2GB)..."
          curl -L -C - --retry 5 -o test_hunyuan_dir/model_q4f16.onnx_data \
            "https://huggingface.co/onnx-community/HY-MT1.5-1.8B-ONNX/resolve/main/onnx/model_q4f16.onnx_data"

      - name: Run Hunyuan Inference Test
        env:
          LLM_MODEL_DIR: ./test_hunyuan_dir
        run: |
          flutter pub get
          flutter test test/llm_release_gate_test.dart

      # ── 串行流转第 4 步：混元测试完成后，派发千问大模型测试 ──
      - name: Trigger Next Workflow (Verify Qwen)
        shell: bash
        run: |
          echo "🚀 Triggering next workflow: 4_verify_qwen.yml..."
          gh workflow run "4. Verify Alibaba Qwen 3.5 0.8B" --ref auto-sync || echo "Dispatched via API"
